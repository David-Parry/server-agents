spring.application.name=git

spring.main.web-application-type=none

spring.main.banner-mode=off

# Git MCP Configuration
mcp.git.enabled=${GIT_MCP_ENABLED:true}

# MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.stdio=true

# Jira MCP Configuration
mcp.jira.enabled=${JIRA_MCP_ENABLED:true}
mcp.jira.site-url=${JIRA_SITE_URL:https://qodo-confluence.atlassian.net}
mcp.jira.email=${JIRA_EMAIL:}
mcp.jira.api-token=${JIRA_API_TOKEN:}

# Terminal MCP Configuration
mcp.terminal.enabled=${TERMINAL_MCP_ENABLED:true}

# GitHub MCP Configuration
mcp.github.enabled=${GITHUB_MCP_ENABLED:true}
mcp.github.api-token=${GITHUB_API_TOKEN:}

# Snyk MCP Configuration
mcp.snyk.enabled=${SNYK_MCP_ENABLED:true}
mcp.snyk.api-token=${SNYK_API_TOKEN:}

# Confluence MCP Configuration
mcp.confluence.enabled=${CONFLUENCE_MCP_ENABLED:true}
mcp.confluence.site-url=${JIRA_SITE_URL:}
mcp.confluence.email=${JIRA_EMAIL:}
mcp.confluence.api-token=${JIRA_API_TOKEN:}

# Azure DevOps MCP Configuration
mcp.azure-devops.enabled=${AZURE_DEVOPS_MCP_ENABLED:true}
mcp.azure-devops.organization-url=${AZURE_DEVOPS_ORGANIZATION_URL:}
mcp.azure-devops.personal-access-token=${AZURE_DEVOPS_PAT:}
mcp.azure-devops.default-project=${AZURE_DEVOPS_DEFAULT_PROJECT:}

# MCP Server Info
spring.ai.mcp.server.name=mcp-internal-server
spring.ai.mcp.server.version=1.0.0


# Logging
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.ai.qodo.mcp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n