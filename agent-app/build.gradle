plugins {
    id "java"
    id "org.springframework.boot" version "3.4.1"
    id "io.spring.dependency-management" version "1.1.7"
    id "jacoco"
}

group = "com.davidparry"
version = "0.0.1-SNAPSHOT"

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencies {
    // Agent SDK library
    implementation project(":agent-sdk")

    // Spring Boot starters (provide Spring context, auto-config, embedded server)
    implementation "org.springframework.boot:spring-boot-starter-websocket"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    // Resilience4j Spring Boot integration (auto-config)
    implementation "io.github.resilience4j:resilience4j-spring-boot3:2.2.0"

    // Prometheus metrics endpoint
    implementation "io.micrometer:micrometer-registry-prometheus"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

bootRun {
    // Inject MCP_* environment variables from ~/.zprofile so secrets are never
    // hardcoded in config files. Works whether the app is launched from a terminal
    // or directly from the IDE (which may not source ~/.zprofile).
    doFirst {
        try {
            def envOutput = ['zsh', '-c', 'source ~/.zprofile 2>/dev/null && env'].execute().text
            envOutput.split('\n').each { line ->
                def idx = line.indexOf('=')
                if (idx > 0) {
                    def key = line.substring(0, idx)
                    if (key.startsWith('MCP_')) {
                        environment(key, line.substring(idx + 1))
                    }
                }
            }
        } catch (Exception ignored) {
            logger.warn('Could not source ~/.zprofile — MCP_* environment variables may not be available')
        }
    }

    // Default to the 'local' Spring profile; override with -Pprofile=<name>
    systemProperty 'spring.profiles.active', findProperty('profile') ?: 'local'
}

tasks.withType(Test) {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.withType(JavaCompile) {
    options.release = 21
}

def coveragePhase = (findProperty("coveragePhase") ?: "baseline").toString()
def coverageThresholdByPhase = [
        baseline    : 0.20,
        intermediate: 0.60,
        target      : 0.85
]
def coverageMinimum = (findProperty("coverageMinimum") ?: coverageThresholdByPhase.getOrDefault(coveragePhase, 0.20)) as BigDecimal

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = "LINE"
                value = "COVEREDRATIO"
                minimum = coverageMinimum
            }
        }
    }
}

tasks.named("check") {
    dependsOn jacocoTestCoverageVerification
}
