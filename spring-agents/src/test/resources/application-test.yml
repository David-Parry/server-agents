spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
    anthropic:
      api-key: test-key
      chat:
        options:
          model: claude-sonnet-4-5
          max-tokens: 4096

mcp:
  proxy:
    enabled: true
    connection:
      idle-timeout-seconds: 300
      heartbeat-interval-seconds: 30
      max-connections-per-client: 5
      max-concurrent-sessions: 10
      require-tls: false
    session:
      max-duration-seconds: 600
      tool-call-timeout-seconds: 60
      tool-call-retry-attempts: 2
      tool-call-retry-delay-ms: 1000
    streaming:
      enabled: true
      chunk-size: 100
      flush-interval-ms: 50
    circuit-breaker:
      failure-threshold: 5
      success-threshold: 3
      timeout-seconds: 30
      half-open-max-calls: 3
    web-socket:
      endpoint: /agent
      allowed-origins:
        - "*"

agent:
  admin:
    api-token: test-admin-token-for-testing-only
    enabled: true
  security:
    hashing-secrets:
      V1: test-secret-v1-for-testing-only-minimum-32-characters
      V2: test-secret-v2-for-testing-only-minimum-32-characters
    current-secret-version: V1
    jwt:
      signing-key: test-jwt-signing-key-for-testing-only-minimum-32-characters
      issuer: spring-agents-test
      expiration-days: 365

logging:
  level:
    root: WARN
    com.davidparry: INFO
